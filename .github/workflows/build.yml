name: Android CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: T1.0/TT1/SnapCompress

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 新增：从 Secrets 解码出密钥库文件
      - name: Decode Keystore
        run: echo ${{ secrets.SIGNING_KEYSTORE_BASE64 }} | base64 -d > app/keystore.jks
        working-directory: T1.0/TT1/SnapCompress

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean
        run: ./gradlew --no-daemon clean

      # 修改：构建时传入签名环境变量
      - name: Assemble Release (APK)
        run: ./gradlew --no-daemon assembleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      # 修改：构建时传入签名环境变量
      - name: Bundle Release (AAB)
        run: ./gradlew --no-daemon bundleRelease
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: T1.0/TT1/SnapCompress/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: T1.0/TT1/SnapCompress/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
