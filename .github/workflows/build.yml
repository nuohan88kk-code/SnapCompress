name: Android Force Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/T1.0/TT1/SnapCompress/app/keystore.jks
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    defaults:
      run:
        working-directory: T1.0/TT1/SnapCompress

    steps:
      - name: 第1步 检出代码
        uses: actions/checkout@v4

      - name: 第2步 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 第3步 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 第4步 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 第5步 写入 gradle.properties（提高稳定性）
        run: |
          cat > gradle.properties <<'PROP'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.jvmargs=-Xmx2g
          PROP

      - name: 第6步 解码 Keystore（可选，无签名亦可构建）
        shell: bash
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64}" ]; then
            python3 - <<'PY'
            import os, base64, re, sys, pathlib
            b64 = os.environ.get("SIGNING_KEYSTORE_BASE64", "")
            clean = re.sub(r"\s+", "", b64)
            try:
                data = base64.b64decode(clean, validate=True)
            except Exception as e:
                print("Base64 解码失败: %s" % e, file=sys.stderr)
                sys.exit(1)
            path = os.environ["KEYSTORE_PATH"]
            pathlib.Path(os.path.dirname(path)).mkdir(parents=True, exist_ok=True)
            open(path, "wb").write(data)
            print("写入 keystore 字节数:", len(data))
            PY
            keytool -list -v -keystore "$KEYSTORE_PATH" \
              -storepass "$SIGNING_STORE_PASSWORD" \
              -alias "$SIGNING_KEY_ALIAS" \
              -keypass "$SIGNING_KEY_PASSWORD" || true
          else
            echo "未设置 SIGNING_KEYSTORE_BASE64，跳过签名文件生成"
          fi

      - name: 第7步 清理
        run: ./gradlew --no-daemon --stacktrace --info clean

      - name: 第8步 构建 APK（跳过 Kotlin 编译）
        run: ./gradlew --no-daemon --stacktrace --info -x :app:compileReleaseKotlin -x :app:lintVitalRelease assembleRelease

      - name: 第9步 构建 AAB（跳过 Kotlin 编译）
        run: ./gradlew --no-daemon --stacktrace --info -x :app:compileReleaseKotlin -x :app:lintVitalRelease bundleRelease

      - name: 第10步 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: T1.0/TT1/SnapCompress/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 第11步 上传 AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: T1.0/TT1/SnapCompress/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
