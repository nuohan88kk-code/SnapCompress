name: Build Release (APK + AAB)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest  # 明确使用 Ubuntu 环境
    defaults:
      run:
        working-directory: T1.0/TT1/SnapCompress  # 严格匹配你的项目目录结构
    steps:
      - uses: actions/checkout@v4  # 第一步，完整拉取你的代码
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # 缓存依赖，避免网络问题
      - name: Make gradlew executable
        run: chmod +x ./gradlew  # 给 Gradle 脚本执行权限，这是 Linux 必须的
      - name: Clean build
        run: ./gradlew clean  # 清理构建缓存
      - name: Build Release APK
        run: ./gradlew assembleRelease  # 执行构建
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: T1.0/TT1/SnapCompress/app/build/outputs/apk/release/*.apk  # 明确 APK 输出路径
