name: Android Signed Release

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      KEYSTORE_PATH: ${{ github.workspace }}/T1.0/TT1/SnapCompress/app/keystore.jks
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    defaults:
      run:
        working-directory: T1.0/TT1/SnapCompress

    steps:
      - name: 第1步 检出代码
        uses: actions/checkout@v4

      - name: 第2步 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: 第3步 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 第4步 赋予 gradlew 可执行权限
        run: chmod +x ./gradlew

      - name: 第5步 写入 gradle.properties
        run: |
          cat > gradle.properties <<'PROP'
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.compiler.execution.strategy=in-process
          kotlin.daemon.jvmargs=-Xmx2g
          PROP

      - name: 第6步 解码 Keystore 并校验
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, base64, sys, pathlib
          b64 = os.environ.get("SIGNING_KEYSTORE_BASE64", "")
          if not b64.strip():
              print("SIGNING_KEYSTORE_BASE64 为空", file=sys.stderr); sys.exit(2)
          clean = re.sub(r'[^A-Za-z0-9+/=]', '', b64)
          pad = (-len(clean)) % 4
          clean = clean + ("=" * pad)
          try:
              data = base64.b64decode(clean)
          except Exception as e:
              print("Base64 解码失败: %s" % e, file=sys.stderr); sys.exit(2)
          path = os.environ["KEYSTORE_PATH"]
          pathlib.Path(os.path.dirname(path)).mkdir(parents=True, exist_ok=True)
          open(path, "wb").write(data)
          if os.path.getsize(path) < 1024:
              print("keystore 大小异常", file=sys.stderr); sys.exit(2)
          PY
          keytool -list -v -keystore "$KEYSTORE_PATH" \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -alias "$SIGNING_KEY_ALIAS" \
            -keypass "$SIGNING_KEY_PASSWORD" | head -n 5

      - name: 第7步 清理
        if: ${{ success() }}
        run: ./gradlew --no-daemon --stacktrace --info clean

      - name: 第8步 构建 APK（Release 签名）
        if: ${{ success() }}
        run: ./gradlew --no-daemon --stacktrace --info assembleRelease

      - name: 第9步 构建 AAB（Release 签名）
        if: ${{ success() }}
        run: ./gradlew --no-daemon --stacktrace --info bundleRelease

      - name: 第10步 上传 APK
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: T1.0/TT1/SnapCompress/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: 第11步 上传 AAB
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: T1.0/TT1/SnapCompress/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
