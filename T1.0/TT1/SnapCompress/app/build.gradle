plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.snapcompress'
    compileSdk 34

    defaultConfig {
        applicationId 'com.snapcompress'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
        vectorDrawables.useSupportLibrary = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    def ks = System.getenv("KEYSTORE_PATH")
    def sp = System.getenv("SIGNING_STORE_PASSWORD")
    def ka = System.getenv("SIGNING_KEY_ALIAS")
    def kp = System.getenv("SIGNING_KEY_PASSWORD")

    signingConfigs {
        release {
            if (ks && sp && ka && kp && file(ks).exists()) {
                storeFile file(ks)
                storePassword sp
                keyAlias ka
                keyPassword kp
                v1SigningEnabled true
                v2SigningEnabled true
            } else {
                throw new GradleException("签名参数缺失或 keystore 文件不存在")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1', 'META-INF/*']
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
}
