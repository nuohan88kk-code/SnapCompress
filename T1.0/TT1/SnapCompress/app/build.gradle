plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.snapcompress'
    compileSdk 34

    defaultConfig {
        applicationId 'com.example.snapcompress'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    def keystorePathEnv = System.getenv("KEYSTORE_PATH")
    def storePassEnv = System.getenv("SIGNING_STORE_PASSWORD")
    def keyAliasEnv = System.getenv("SIGNING_KEY_ALIAS")
    def keyPassEnv = System.getenv("SIGNING_KEY_PASSWORD")

    signingConfigs {
        release {
            if (keystorePathEnv && storePassEnv && keyAliasEnv && keyPassEnv && file(keystorePathEnv).exists()) {
                storeFile file(keystorePathEnv)
                storePassword storePassEnv
                keyAlias keyAliasEnv
                keyPassword keyPassEnv
                v1SigningEnabled true
                v2SigningEnabled true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystorePathEnv && file(keystorePathEnv).exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'com.google.android.gms:play-services-ads:22.6.0'
}
